<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>今日叫貨單</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F0EAD9; --ink: #2B2118; --ink-soft: #6B6152;
    --red: #B7312C; --green: #5C7A52; --line: #C9BFA8;
  }
  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%; /* 關閉 iOS Safari 的自動文字縮放，避免字體莫名變小 */
    text-size-adjust: 100%;
  }
  body {
    margin: 0; background: #DED4BE; font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink); display: flex; justify-content: center; min-height: 100vh; padding: 32px 16px;
  }
  .ticket { width: 100%; max-width: 400px; background: var(--paper); position: relative; }
  .header { position: relative; padding: 28px 24px 20px; text-align: center; border-bottom: 1px dashed var(--line); }
  .add-item-btn {
    position: absolute; top: 20px; right: 20px; width: 34px; height: 34px;
    border: 1px solid var(--ink); border-radius: 50%; background: var(--paper); color: var(--ink);
    font-size: 19px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .item-select-wrap { display: flex; align-items: center; gap: 8px; }
  .item-select {
    flex: 1; min-width: 0; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 500;
    color: var(--ink); background: rgba(255,255,255,0.5); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
  }
  .remove-item { flex-shrink: 0; width: 22px; height: 22px; border: none; background: none; color: var(--ink-soft); font-size: 15px; cursor: pointer; }
  .new-tag { font-size: 11.5px; color: var(--red); }
  .stamp {
    width: 52px; height: 52px; border: 2px solid var(--red); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
    color: var(--red); font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 18px; transform: rotate(-4deg);
  }
  .shop-name { font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 22px; margin: 0 0 6px; }
  .meta { font-size: 13px; color: var(--ink-soft); }
  .items { padding: 4px 24px; }
  .item { padding: 18px 0; border-bottom: 1px dashed var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .item:last-child { border-bottom: none; }
  .item-name { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
  .item-usual { font-size: 12.5px; color: var(--ink-soft); }
  .item-usual .changed { color: var(--red); font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .stepper button {
    width: 34px; height: 34px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .stepper button.minus { border-radius: 6px 0 0 6px; }
  .stepper button.plus { border-radius: 0 6px 6px 0; }
  .stepper .qty {
    width: 44px; text-align: center; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 700;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); height: 34px;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper .qty.changed { color: var(--red); }
  .footer { padding: 20px 24px 32px; }
  .submit-btn {
    width: 100%; background: var(--red); color: var(--paper); border: none; padding: 15px;
    font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
  }
  .footnote { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 10px; }
  .state-view { padding: 60px 24px; text-align: center; }
  .state-view p { color: var(--ink-soft); font-size: 14px; line-height: 1.7; }
  .confirm-stamp {
    width: 64px; height: 64px; border: 3px solid var(--green); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    color: var(--green); font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 15px; transform: rotate(-6deg);
  }
  .confirm-title { font-family: 'Noto Serif TC', serif; font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  .register-view { padding: 32px 24px; }
  .register-view p.intro { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.6; text-align: center; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 12px; font-size: 15px; font-family: 'Noto Sans TC', sans-serif;
    border: 1px solid var(--line); border-radius: 4px; background: rgba(255,255,255,0.5); color: var(--ink);
  }
  .empty-items { text-align: center; padding: 40px 24px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.7; }
</style>
</head>
<body>

<div class="ticket">
  <div class="header">
    <button class="add-item-btn" id="addBtn" onclick="addItem()" style="display:none;" aria-label="新增麵種">＋</button>
    <div class="stamp">大裕</div>
    <p class="shop-name">大裕製麵廠・今日叫貨</p>
    <p class="meta" id="metaLine">讀取中...</p>
  </div>

  <div id="content">
    <div class="state-view"><p>正在確認您的訂購資料，請稍候...</p></div>
  </div>
</div>

<script>
  let liffUserId = null;
  let liffAccessToken = null;
  let customerData = null;

  async function main() {
    try {
      await liff.init({ liffId: '2011570405-tzdACxGL' });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      liffUserId = profile.userId;
      liffAccessToken = liff.getAccessToken(); // 後端會拿這個向 LINE 驗證身份，不是單純相信 userId 字串

      const url = `${getScriptUrl_()}?action=getCustomerData&userId=${encodeURIComponent(liffUserId)}&accessToken=${encodeURIComponent(liffAccessToken)}`;
      const res = await fetch(url);
      customerData = await res.json();

      if (customerData.found) {
        renderForm_();
      } else {
        renderRegisterView_();
      }
    } catch (err) {
      document.getElementById('content').innerHTML =
        `<div class="state-view"><p>發生錯誤，請稍後再試或聯繫店家。</p></div>`;
      console.error(err);
    }
  }

  // 這個網址就是你 doGet/doPost 那個 Apps Script 部署後拿到的網址（結尾 /exec）
  function getScriptUrl_() {
    return 'https://script.google.com/macros/s/AKfycbzfbnhw1RbjgDPeKHKtRWLYI3FaJhd6O90UL3GWmaHjgnfy70trIBVDpZ3EBImi1rKIhA/exec';
  }

  function renderRegisterView_() {
    document.getElementById('metaLine').textContent = '第一次使用・請先填寫基本資料';
    document.getElementById('content').innerHTML = `
      <div class="register-view">
        <p class="intro">您好，這是第一次為您設定叫貨資料<br>請填寫以下資訊，之後就能直接用 LINE 調整每日訂購</p>
        <div class="field">
          <label>店名 / 姓名</label>
          <input type="text" id="regName" placeholder="例如：陳記小吃店">
        </div>
        <div class="field">
          <label>聯絡電話</label>
          <input type="tel" id="regPhone" placeholder="例如：0912-345-678">
        </div>
      </div>
      <div class="footer">
        <button class="submit-btn" onclick="submitRegister()">建立資料</button>
        <p class="footnote">建立後即可開始設定平常訂購的麵種</p>
      </div>
    `;
  }

  async function submitRegister() {
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();

    if (!name) {
      alert('請填寫店名或姓名');
      return;
    }

    const res = await fetch(getScriptUrl_(), {
      method: 'POST',
      body: JSON.stringify({
        type: 'registerCustomer',
        userId: liffUserId,
        accessToken: liffAccessToken,
        name,
        phone,
      }),
    });
    customerData = await res.json();
    renderForm_(); // 建好資料後直接切換到訂單畫面，這時品項是空的
  }

  // 前端操作用的工作清單，跟 customerData.items 分開，這樣新增/移除時不用一直改動原始資料
  let workingItems = [];
  let nextTempId = 1;

  function renderForm_() {
    document.getElementById('metaLine').textContent = `${customerData.name}・明天出貨`;
    document.getElementById('addBtn').style.display = 'flex';

    workingItems = customerData.items.map(item => ({
      tempId: nextTempId++,
      noodleTypeId: item.noodleTypeId,
      name: item.name,
      usualAmount: item.usualAmount,
      qty: item.qty, // 優先用後端算好的份數（有上次訂單就用上次的，沒有才是平常預設值）
      isNew: false,
    }));

    renderItemsList_();
  }

  function renderItemsList_() {
    if (workingItems.length === 0) {
      document.getElementById('content').innerHTML = `
        <div class="empty-items">您還沒有設定常訂的麵種<br>點選右上角「＋」新增第一個品項</div>
        <div class="footer"><p class="footnote">目前尚無品項可送出</p></div>
      `;
      return;
    }

    const rowsHtml = workingItems.map(item => {
      if (item.isNew) {
        const usedIds = workingItems.filter(i => i.tempId !== item.tempId && i.noodleTypeId).map(i => i.noodleTypeId);
        const options = customerData.allNoodleTypes
          .filter(t => t.noodleTypeId === item.noodleTypeId || !usedIds.includes(t.noodleTypeId))
          .map(t => `<option value="${t.noodleTypeId}" ${item.noodleTypeId === t.noodleTypeId ? 'selected' : ''}>${t.name}</option>`)
          .join('');

        return `
          <div class="item">
            <div style="flex:1;">
              <div class="item-select-wrap">
                <select class="item-select" onchange="setItemName(${item.tempId}, this.value)">
                  <option value="" ${item.noodleTypeId ? '' : 'selected'} disabled>請選擇麵種</option>
                  ${options}
                </select>
                <button class="remove-item" onclick="removeItem(${item.tempId})">✕</button>
              </div>
              <p class="item-usual new-tag">新增品項</p>
            </div>
            <div class="stepper">
              <button class="minus" onclick="changeQty(${item.tempId}, -1)">－</button>
              <div class="qty changed">${item.qty}</div>
              <button class="plus" onclick="changeQty(${item.tempId}, 1)">＋</button>
            </div>
          </div>
        `;
      }

      const changed = item.usualAmount !== null && item.qty !== item.usualAmount;
      const usualLabel = item.usualAmount !== null
        ? `平常訂 ${item.usualAmount} 份${changed ? ' <span class="changed">・已調整</span>' : ''}`
        : `上次訂購 ${item.qty} 份`;

      return `
        <div class="item">
          <div>
            <p class="item-name">${item.name} <button class="remove-item" onclick="removeItem(${item.tempId})">✕</button></p>
            <p class="item-usual">${usualLabel}</p>
          </div>
          <div class="stepper">
            <button class="minus" onclick="changeQty(${item.tempId}, -1)">－</button>
            <div class="qty ${changed ? 'changed' : ''}">${item.qty}</div>
            <button class="plus" onclick="changeQty(${item.tempId}, 1)">＋</button>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('content').innerHTML = `
      <div class="items">${rowsHtml}</div>
      <div class="footer">
        <button class="submit-btn" onclick="submitOrder()">確認送出</button>
        <p class="footnote">送出前都可以修改，晚上 8 點前有效</p>
      </div>
    `;
  }

  function addItem() {
    workingItems.push({ tempId: nextTempId++, noodleTypeId: '', name: '', usualAmount: null, qty: 1, isNew: true });
    renderItemsList_();
  }

  function removeItem(tempId) {
    workingItems = workingItems.filter(i => i.tempId !== tempId);
    renderItemsList_();
  }

  function setItemName(tempId, noodleTypeId) {
    const item = workingItems.find(i => i.tempId === tempId);
    const type = customerData.allNoodleTypes.find(t => t.noodleTypeId === noodleTypeId);
    item.noodleTypeId = noodleTypeId;
    item.name = type ? type.name : '';
    renderItemsList_();
  }

  function changeQty(tempId, delta) {
    const item = workingItems.find(i => i.tempId === tempId);
    item.qty = Math.max(0, item.qty + delta);
    renderItemsList_();
  }

  async function submitOrder() {
    const items = workingItems
      .filter(item => item.noodleTypeId) // 還沒選麵種的新品項不送出
      .map(item => ({ noodleTypeId: item.noodleTypeId, qty: item.qty }));

    await fetch(getScriptUrl_(), {
      method: 'POST',
      body: JSON.stringify({
        type: 'orderSubmit',
        userId: liffUserId,
        accessToken: liffAccessToken,
        items,
      }),
    });

    document.getElementById('content').innerHTML = `
      <div class="state-view">
        <div class="confirm-stamp">已送出</div>
        <p class="confirm-title">明天的訂購已收到</p>
        <p>大裕製麵廠會依照這份清單準備<br>如需再調整，8 點前都可以重新開啟送出</p>
      </div>
    `;
    document.getElementById('addBtn').style.display = 'none';
  }

  main();
</script>

</body>
</html>
